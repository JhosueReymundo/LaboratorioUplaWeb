version: '3.8'

services:
  react-laboratorio:
    build:
      context: .
      # SIN args fijos - el nginx se encarga
    container_name: weblaboratorio-react
    ports:
      - "3001:80"  # Cambia según necesites
    restart: unless-stopped
    # SIN environment variables para API (ahora es dinámico)
    # Opcional: healthcheck
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s