server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # ========== DETECCIÓN AUTOMÁTICA DE RANGO ==========
    # Valor por defecto: rango 50
    set $backend_ip "172.16.50.11";
    set $backend_url "http://172.16.50.11:3000";
    set $api_url "http://172.16.50.11:3000/api";
    
    # Si el cliente viene del rango 106
    if ($remote_addr ~ "^172\.16\.106\.") {
        set $backend_ip "172.16.106.19";
        set $backend_url "http://172.16.106.19:3000";
        set $api_url "http://172.16.106.19:3000/api";
    }
    
    # Inyectar configuración en el HTML para React
    sub_filter '</head>' '
        <script>
            // Configuración inyectada por Nginx
            window.APP_CONFIG = {
                API_HOST: "$backend_ip",
                API_URL: "$api_url",
                BACKEND_URL: "$backend_url",
                CLIENT_IP: "$remote_addr",
                CLIENT_RANGE: "$backend_ip"
            };
            console.log("🌐 Configuración detectada:", window.APP_CONFIG);
        </script>
    </head>';
    sub_filter_once on;
    
    # ========== PROXY PARA API ==========
    location /api/ {
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # ========== ARCHIVOS UPLOADS ==========
    location /uploads/ {
        # Primero intentar servir desde Nginx
        alias /usr/share/nginx/html/uploads/;
        try_files $uri @backend_uploads;
        
        # CORS para archivos
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location @backend_uploads {
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # ========== REACT APP ==========
    location / {
        try_files $uri $uri/ /index.html;
        
        # No cache para SPA
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # ========== CONFIGURACIÓN EXTRA ==========
    client_max_body_size 100M;
    
    # Manejo de errores
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}